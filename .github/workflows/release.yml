name: Release

# 推送 v* 标签后运行测试、打包，并创建草稿 Release。
# 在 GitHub 上核对附件、补写发布说明后再手动发布；草稿不会触发应用内自动更新。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('version.py', encoding='utf-8').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Fetch qaac/refalac encoders
        run: python tools/fetch_qaac.py

      - name: Run tests
        # 托管 runner 的默认临时目录是 8.3 短路径（RUNNER~1），与程序解析出的长路径不一致，测试会误判为经过链接。
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build ClassicDrop
        shell: pwsh
        run: .\build.ps1 -Python python

      - name: Create portable ZIP
        run: python -c "import shutil; shutil.make_archive('dist/ClassicDrop-Windows-x64', 'zip', 'dist', 'ClassicDrop')"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\ClassicDrop.iss'

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: ClassicDrop-Windows
          path: |
            dist/ClassicDrop-Windows-x64.zip
            dist/installer/ClassicDropSetup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Run bundled self-test
        # 打包好的程序先自检一遍：签名、FFmpeg、refalac、tkdnd 全部通过才继续。
        shell: pwsh
        run: |
          $json = "$env:RUNNER_TEMP\self-test.json"
          $p = Start-Process -PassThru -FilePath "dist\ClassicDrop\ClassicDrop.exe" -ArgumentList "--self-test", $json
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content $json
          if ($p.ExitCode -ne 0) { exit 1 }

  arm64-smoke:
    # 在 ARM64 runner 上验证 x64 包能在模拟环境下正常启动（wasmtime 等原生组件）。
    needs: [windows]
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          name: ClassicDrop-Windows

      - name: Expand portable ZIP
        shell: pwsh
        run: Expand-Archive -LiteralPath ClassicDrop-Windows-x64.zip -DestinationPath app

      - name: Run bundled self-test under emulation
        # 限时等待，避免 PyInstaller 的崩溃对话框把任务挂住。
        shell: pwsh
        run: |
          $json = "$env:RUNNER_TEMP\self-test.json"
          $p = Start-Process -PassThru -FilePath "$PWD\app\ClassicDrop\ClassicDrop.exe" -ArgumentList "--self-test", $json
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content $json
          $report = Get-Content $json -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $report.ok) { exit 1 }
          if ($report.host_arch -ne "ARM64" -or $report.process_arch -ne "x64") { exit 1 }
          if ($report.wasmtime_dll -notmatch "win32-x86_64") { exit 1 }

  macos:
    # Apple Silicon 与 Intel 各打一个 DMG，只签名（ad-hoc），不做公证。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('version.py', encoding='utf-8').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - name: Check Tk works
        run: python -c "import tkinter; tkinter.Tk().destroy()"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build ClassicDrop.app and DMG
        run: bash build_mac.sh python

      - name: Run bundled self-test
        # 打包好的程序先自检一遍：签名、FFmpeg、afconvert、tkdnd 全部通过才继续。
        run: |
          # 窗口程序无控制台输出，限时 120 秒，结果只写在 JSON 里。
          python tools/selftest_check.py "$RUNNER_TEMP/self-test.json" "${{ matrix.arch }}"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: ClassicDrop-macOS-${{ matrix.arch }}
          path: dist/ClassicDrop-macOS-${{ matrix.arch }}-*.dmg
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: [windows, arm64-smoke, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 构件可能带子目录（如 installer/），只上传其中的文件。
          mapfile -t files < <(find packages -type f | sort)
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "ClassicDrop $GITHUB_REF_NAME" \
            --notes "发布说明待补充。"
